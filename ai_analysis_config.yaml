# AI 分析結果儲存設定
# ─────────────────────────────────────────────
# save_folder：下載時建議儲存的資料夾
#   - 填相對路徑（相對於儀表板資料夾）：AI分析結果
#   - 或填完整絕對路徑，例如：C:/Users/Mora/Documents/AI分析結果
# ─────────────────────────────────────────────

save_folder: "AI分析結果"

# filename_prefix：檔名前綴，後面自動加上時間戳記
#   產出範例：AI分析_20260321_1430.md
filename_prefix: "AI分析"
